<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión Médica</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="login-modal" class="modal-overlay">
        <div class="login-box">
            <h2>🩺 Iniciar Sesión</h2>
            <form id="form-login">
                <input type="text" id="username" placeholder="Usuario (Ej. admin)" required>
                <input type="password" id="password" placeholder="Contraseña (Ej. admin123)" required>
                <button type="submit" class="btn-primary">Ingresar</button>
                <p id="login-error" class="error-msg" style="display: none;"></p>
            </form>
        </div>
    </div>

    <div class="layout" style="display: none;" id="main-app">
        <aside class="sidebar">
            <div class="logo">🩺 Sistema de Gestión</div>
            <nav>
                <ul>
                    <li><a href="#" id="menu-inicio">Inicio</a></li>
                    <li><a href="#" id="menu-citas" class="active">Citas</a></li>
                    <li><a href="#" id="menu-logout" style="color: #ff6b6b; margin-top: 20px;">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar"><span id="user-display">👤 Usuario</span></header>
            <div class="views-container">
                
                <section id="vista-listado" class="view active">
                    <div class="card-header"><h2>Resumen de Turnos</h2></div>
                    <div class="toolbar">
                        <input type="text" id="buscador-citas" placeholder="🔍 Buscar por paciente...">
                        <div class="filtros">
                            <label><input type="checkbox" id="filtro-activo" checked> Activo</label>
                            <label><input type="checkbox" id="filtro-pasado"> Pasado</label>
                        </div>
                    </div>
                    <div id="contenedor-citas" class="citas-grid"></div>
                    <button id="btn-nueva-cita" class="btn-primary" style="margin-top: 15px;">+ Nueva Cita</button>
                </section>

                <section id="vista-formulario" class="view" style="display: none;">
                    <div class="card-header"><h2>Agregar Registro</h2></div>
                    <div class="form-layout">
                        <!-- Formularios con POST[cite: 5] -->
                        <form id="form-ingreso" action="/api/citas" method="POST">
                            <div class="form-group">
                                <label>Nombre:</label>
                                <input type="text" id="nombre" required>
                            </div>
                            <div class="form-group">
                                <label>Código Seguro:</label>
                                <input type="text" id="codigo" required>
                            </div>
                            <div class="form-group">
                                <label>Especialidad:</label>
                                <input type="text" id="especialidad" required>
                            </div>
                            <button type="submit" class="btn-primary">💾 Guardar</button>
                            <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
