<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Médica</title>
    <link rel="stylesheet" href="style.css">
    <!-- Carga de jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="layout">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <div class="logo">🩺 Sistema de Gestión</div>
            <nav>
                <ul>
                    <li><a href="#" id="menu-inicio">Inicio</a></li>
                    <!-- Evento click según wireframe -->
                    <li><a href="#" id="menu-citas" class="active">Citas</a></li>
                    <li><a href="#" id="menu-pacientes">Pacientes</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="topbar">
                <span>👤 Usuario (Admin)</span>
            </header>

            <div class="views-container">
                
                <!-- VISTA 1: Listado de Citas -->
                <section id="vista-listado" class="view active">
                    <div class="card-header">
                        <h2>Resumen de Turnos</h2>
                    </div>
                    
                    <div class="toolbar">
                        <!-- Evento onInput según wireframe -->
                        <input type="text" id="buscador-citas" placeholder="🔍 Buscar por paciente...">
                        
                        <div class="filtros">
                            <label><input type="checkbox" id="filtro-activo" checked> Activo</label>
                            <!-- Evento onChange según wireframe -->
                            <label><input type="checkbox" id="filtro-pasado"> Pasado</label>
                        </div>
                    </div>

                    <div id="contenedor-citas" class="citas-grid">
                        <!-- Las citas se generarán dinámicamente aquí -->
                    </div>
                    
                    <button id="btn-nueva-cita" class="btn-primary" style="margin-top: 15px;">+ Nueva Cita</button>
                </section>

                <!-- VISTA 2: Formulario de Registro -->
                <section id="vista-formulario" class="view" style="display: none;">
                    <div class="card-header">
                        <h2>Agregar Nuevo Registro</h2>
                        <p>Complete los datos del paciente y turno.</p>
                    </div>

                    <div class="form-layout">
                        <!-- Evento onSubmit según wireframe -->
                        <form id="form-ingreso">
                            <div class="form-group">
                                <label for="nombre">Nombre (Solo letras):</label>
                                <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required pattern="[A-Za-záéíóúÁÉÍÓÚ\s]+">
                            </div>
                            <div class="form-group">
                                <label for="codigo">Número de Seguro:</label>
                                <input type="text" id="codigo" placeholder="Ej: P-2026-001" required>
                            </div>
                            <div class="form-group">
                                <label for="especialidad">Especialidad:</label>
                                <input type="text" id="especialidad" placeholder="Ej: Traumatología" required>
                            </div>
                            <button type="submit" class="btn-primary">💾 Guardar Registro</button>
                            <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
                        </form>

                        <aside class="ayuda-lateral">
                            <h3>💡 Ayuda</h3>
                            <ul>
                                <li><strong>Nombre:</strong> Solo caracteres alfabéticos.</li>
                                <li><strong>Núemro de Seguro:</strong> Colocar guiones.</li>
                            </ul>
                        </aside>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- Vinculación del script modular -->
    <script src="script.js"></script>
</body>
</html>
